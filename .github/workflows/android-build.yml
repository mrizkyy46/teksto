
name: Android Build / Publish GitHub Release

on:
  push:
    branches: [main]
    tags: ["v*"]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      # ==========================================
      # SIGNED BUILD: Only for version tags (v*)
      # ==========================================

      - name: Prepare release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_SIGNING_KEYSTORE_BASE64 \
            ANDROID_SIGNING_KEYSTORE_PASSWORD \
            ANDROID_SIGNING_KEY_ALIAS \
            ANDROID_SIGNING_KEY_PASSWORD
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required Actions secret: $secret_name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/teksto-release-key.p12"

          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Keystore file is empty or invalid"
            exit 1
          fi

          echo "Verifying PKCS12 keystore..."

          keytool -list \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$ANDROID_SIGNING_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_SIGNING_KEY_ALIAS" \
            > /dev/null

          echo "PKCS12 keystore verified successfully."
          echo "Keystore location: $KEYSTORE"
          ls -lh "$KEYSTORE"

      - name: Assemble signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/teksto-release-key.p12
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Checking signing keystore..."

          test -s "$ANDROID_SIGNING_KEYSTORE_PATH" || {
            echo "::error::Keystore file not found"
            exit 1
          }

          echo "Building signed release APK..."

          gradle --no-daemon :app:assembleRelease

          echo "Signed APK output:"
          find app/build/outputs/apk -type f -name "*.apk"

          test -f app/build/outputs/apk/release/app-release.apk || {
            echo "::error::Signed APK was not generated"
            exit 1
          }

      - name: Verify signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "Signed APK verification successful."

      - name: Upload signed release APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: teksto-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ==========================================
      # UNSIGNED BUILD: Main / Pull Request
      # ==========================================

      - name: Assemble unsigned release APK
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail

          echo "Building unsigned release APK..."

          gradle --no-daemon :app:assembleRelease

          echo "Unsigned APK output:"
          find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload unsigned release APK artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: teksto-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/teksto-release-key.p12"

  # ==========================================
  # PUBLISH GITHUB RELEASE
  # ==========================================

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: teksto-release
          path: release

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload "$GITHUB_REF_NAME" \
            release/app-release.apk \
            --clobber